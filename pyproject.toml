[project]
name = "bootstrap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "openai>=3.55.1",
    "prompt-toolkit>=3.0.53",
    "pypsicquic>=0.2.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
    "tiktoken>=0.14.0",
]

[project.scripts]
tlc = "bootstrap:main"
psq = "bootstrap.tools.psicquic:test"
[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
